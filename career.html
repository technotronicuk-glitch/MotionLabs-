<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | MotionLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-kinetic { color: #ff5722; }
        .bg-kinetic { background-color: #ff5722; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <nav class="p-6">
        <a href="index.html" class="text-sm font-bold uppercase tracking-widest flex items-center gap-2 hover:text-kinetic transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Hub
        </a>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-6">
        <div class="mb-20">
            <h1 class="text-6xl font-black uppercase italic tracking-tighter leading-none mb-4">Join the <br><span class="text-kinetic">Evolution</span></h1>
            <p class="max-w-xl text-slate-500 font-medium text-lg">We're looking for the world's best neural engineers, designers, and visionaries to help us bridge the gap between human and machine.</p>
        </div>

        <div class="space-y-4">
            <div class="group bg-white p-8 rounded-3xl border border-slate-100 flex flex-col md:flex-row justify-between items-center hover:shadow-xl transition-all duration-300">
                <div>
                    <span class="text-[10px] font-black bg-slate-100 px-3 py-1 rounded-full uppercase tracking-widest">Engineering</span>
                    <h3 class="text-2xl font-black mt-2 uppercase">Neural Interface Lead</h3>
                    <p class="text-slate-500">Remote / Zürich, CH</p>
                </div>
                <button class="mt-6 md:mt-0 px-8 py-3 rounded-full border-2 border-slate-900 font-bold uppercase text-xs hover:bg-slate-900 hover:text-white transition">Apply Now</button>
            </div>

            <div class="group bg-white p-8 rounded-3xl border border-slate-100 flex flex-col md:flex-row justify-between items-center hover:shadow-xl transition-all duration-300">
                <div>
                    <span class="text-[10px] font-black bg-slate-100 px-3 py-1 rounded-full uppercase tracking-widest">Design</span>
                    <h3 class="text-2xl font-black mt-2 uppercase">Bionic UX Designer</h3>
                    <p class="text-slate-500">London, UK / Hybrid</p>
                </div>
                <button class="mt-6 md:mt-0 px-8 py-3 rounded-full border-2 border-slate-900 font-bold uppercase text-xs hover:bg-slate-900 hover:text-white transition">Apply Now</button>
            </div>
        </div>
    </main>
</body>
</html>
